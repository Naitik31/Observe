apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openobserve
  namespace: observability
  labels:
    app: openobserve
spec:
  serviceName: openobserve
  replicas: 1
  selector:
    matchLabels:
      app: openobserve
  template:
    metadata:
      labels:
        app: openobserve
    spec:
      securityContext:
        fsGroup: 2000
      containers:
        - name: openobserve
          image: openobserve/openobserve:v0.14.4
          ports:
            - name: http
              containerPort: 5080
            - name: grpc
              containerPort: 5081
          envFrom:
            - secretRef:
                name: openobserve-credentials
          env:
            - name: ZO_DATA_DIR
              value: "/data"
            - name: ZO_HTTP_PORT
              value: "5080"
            - name: ZO_GRPC_PORT
              value: "5081"
            - name: ZO_TELEMETRY
              value: "false"
          volumeMounts:
            - name: openobserve-data
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5080
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: openobserve-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi